services:
  - type: web
    name: smart-siem-frontend
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_FORCE_MOCK
        value: "false"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
